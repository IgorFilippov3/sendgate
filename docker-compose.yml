services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - SENDGATE_API_KEY=${SENDGATE_API_KEY:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - APP_VERSION=${APP_VERSION:-0.2.0}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - MAX_BULK_EMAILS=${MAX_BULK_EMAILS:-100}
      - SMTP_PROBE_ENABLED=${SMTP_PROBE_ENABLED:-false}
      - SMTP_HELO_NAME=${SMTP_HELO_NAME:-}
      - SMTP_MAIL_FROM=${SMTP_MAIL_FROM:-}
      - SMTP_CONCURRENCY=${SMTP_CONCURRENCY:-5}
      - DNS_SERVERS=${DNS_SERVERS:-}
      - SPAMHAUS_DQS_KEY=${SPAMHAUS_DQS_KEY:-}
      - DISPOSABLE_AUTO_UPDATE=${DISPOSABLE_AUTO_UPDATE:-true}
      - DOMAIN_CACHE_TTL=${DOMAIN_CACHE_TTL:-900}
