services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - SENDGATE_API_KEY=${SENDGATE_API_KEY}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - MAX_BULK_EMAILS=${MAX_BULK_EMAILS:-100}
      - DISPOSABLE_AUTO_UPDATE=${DISPOSABLE_AUTO_UPDATE:-true}
      - DISPOSABLE_UPDATE_INTERVAL_HOURS=${DISPOSABLE_UPDATE_INTERVAL_HOURS:-24}
      - DNS_SERVERS=${DNS_SERVERS:-8.8.8.8,1.1.1.1,9.9.9.9}
      - SCORE_THRESHOLD_SAFE=${SCORE_THRESHOLD_SAFE:-90}
      - SCORE_THRESHOLD_RISKY=${SCORE_THRESHOLD_RISKY:-75}
      - SCORE_THRESHOLD_DANGEROUS=${SCORE_THRESHOLD_DANGEROUS:-60}
      - SCORE_THRESHOLD_CRITICAL=${SCORE_THRESHOLD_CRITICAL:-40}
